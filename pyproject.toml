[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reloadm"
version = "0.2.0"
description = "Reload a Python module hierarchy during notebook and REPL development"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mazen Alotaibi" }]
keywords = ["development", "importlib", "jupyter", "reload", "repl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ma7dev/reloadm"
Issues = "https://github.com/ma7dev/reloadm/issues"
Repository = "https://github.com/ma7dev/reloadm"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.13.0",
  "twine==6.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["reloadm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=reloadm --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["reloadm"]
