[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "reloadm"
version = "0.3.0"
description = "Reload a Python module hierarchy during notebook and REPL development"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mazen Alotaibi" }]
keywords = ["development", "importlib", "jupyter", "reload", "repl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ma7dev/reloadm"
Issues = "https://github.com/ma7dev/reloadm/issues"
Repository = "https://github.com/ma7dev/reloadm"

[project.optional-dependencies]
ipython = ["ipython>=8.18"]
dev = [
  "build==1.6.1",
  "ipykernel>=6.29",
  "mypy==2.3.1",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.7",
  "twine==7.0.0",
  "ipython>=8.18",
]

[tool.hatch.build.targets.wheel]
packages = ["reloadm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=reloadm --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["reloadm"]
